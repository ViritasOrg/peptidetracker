<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Peptide Tracker — Tests</title>
<style>
  body{font-family:'DM Sans',monospace,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:20px;max-width:640px;margin:0 auto;}
  h1{font-size:18px;letter-spacing:2px;color:#e8ff3c;text-transform:uppercase;margin-bottom:20px;}
  .suite{margin-bottom:24px;}
  .suite-name{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:8px;}
  .test{display:flex;align-items:flex-start;gap:10px;padding:7px 0;border-bottom:1px solid #1a1a1a;font-size:13px;}
  .pass{color:#3cffa0;}
  .fail{color:#ff4444;}
  .badge{font-size:10px;font-weight:700;letter-spacing:1px;flex-shrink:0;padding:2px 7px;border-radius:10px;}
  .badge-pass{background:#3cffa011;border:1px solid #3cffa044;color:#3cffa0;}
  .badge-fail{background:#ff444411;border:1px solid #ff444444;color:#ff4444;}
  .err{font-size:11px;color:#ff6b6b;margin-top:3px;font-family:monospace;}
  .summary{margin-top:20px;padding:14px;border-radius:8px;font-size:13px;font-weight:600;}
  .summary.all-pass{background:#3cffa011;border:1px solid #3cffa044;color:#3cffa0;}
  .summary.has-fail{background:#ff444411;border:1px solid #ff444444;color:#ff4444;}
</style>
</head>
<body>
<h1>Peptide Tracker Tests</h1>
<div id="results"></div>
<script>
// ── Pure functions under test (extracted from index.html) ─────────────────────

const HEIGHT_CM = 182;

function navyBF(n, b, h) {
  return Math.round((495 / (1.0324 - 0.19077 * Math.log10(b - n) + 0.15456 * Math.log10(h)) - 450) * 10) / 10;
}

function calcBMI(weightKg, heightCm) {
  return Math.round(weightKg / Math.pow(heightCm / 100, 2) * 10) / 10;
}

function getWeightForDate(dateStr, weights) {
  if (!weights.length) return null;
  const target = new Date(dateStr.replace(/-/g, '/'));
  let best = null, bestDiff = Infinity;
  for (const w of weights) {
    const diff = Math.abs(target - new Date(w.date.replace(/-/g, '/')));
    if (diff < bestDiff) { bestDiff = diff; best = w.weight; }
  }
  return bestDiff <= 7 * 86400000 ? best : null;
}

// Synthetic "today" BMI point logic (mirrors bcRender)
function buildBmiChartData(arr, latestW, heightCm, todayDateStr) {
  const bmiData = arr.filter(e => e.bmi);
  let vals = bmiData.map(e => e.bmi);
  let labels = bmiData.map(e => e.dateLabel);
  if (latestW && arr.length) {
    const lastDate = arr[arr.length - 1].date;
    if (todayDateStr > lastDate) {
      const todayBmi = Math.round(latestW / Math.pow(heightCm / 100, 2) * 10) / 10;
      vals = [...vals, todayBmi];
      labels = [...labels, 'Today'];
    }
  }
  return { vals, labels };
}

// ── Test runner ───────────────────────────────────────────────────────────────

const suites = [];
let currentSuite = null;

function describe(name, fn) {
  currentSuite = { name, tests: [] };
  suites.push(currentSuite);
  fn();
}

function it(name, fn) {
  try { fn(); currentSuite.tests.push({ name, pass: true }); }
  catch (e) { currentSuite.tests.push({ name, pass: false, err: e.message }); }
}

function expect(actual) {
  return {
    toBe(expected) {
      if (actual !== expected) throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    },
    toBeCloseTo(expected, dp = 1) {
      const factor = Math.pow(10, dp);
      if (Math.round(actual * factor) !== Math.round(expected * factor))
        throw new Error(`Expected ~${expected}, got ${actual}`);
    },
    toBeNull() {
      if (actual !== null) throw new Error(`Expected null, got ${JSON.stringify(actual)}`);
    },
    toEqual(expected) {
      if (JSON.stringify(actual) !== JSON.stringify(expected))
        throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
    },
    toHaveLength(n) {
      if (actual.length !== n) throw new Error(`Expected length ${n}, got ${actual.length}`);
    },
    toBeGreaterThan(n) {
      if (actual <= n) throw new Error(`Expected > ${n}, got ${actual}`);
    },
    toBeLessThan(n) {
      if (actual >= n) throw new Error(`Expected < ${n}, got ${actual}`);
    },
  };
}

// ── Test suites ───────────────────────────────────────────────────────────────

describe('navyBF — US Navy body fat formula', () => {
  it('known reference: neck=38 belly=85 height=182 → ~18.8%', () => {
    expect(navyBF(38, 85, 182)).toBeCloseTo(18.8, 0);
  });
  it('neck=42 belly=93 height=182 → matches Henrik screenshot 18.8%', () => {
    expect(navyBF(42, 93, 182)).toBeCloseTo(18.8, 0);
  });
  it('higher belly → higher BF%', () => {
    const bf1 = navyBF(42, 93, 182);
    const bf2 = navyBF(42, 96, 182);
    expect(bf2).toBeGreaterThan(bf1);
  });
  it('larger neck (more muscle) → lower BF%', () => {
    const bf1 = navyBF(42, 93, 182);
    const bf2 = navyBF(44, 93, 182);
    expect(bf2).toBeLessThan(bf1);
  });
  it('belly must be greater than neck (formula domain)', () => {
    // belly=93, neck=42 → valid; belly=40, neck=42 → log10 of negative = NaN
    const bad = navyBF(42, 40, 182);
    expect(isNaN(bad) || bad < 0 || bad > 60).toBe(true);
  });
});

describe('calcBMI', () => {
  it('92.3kg / 182cm → 27.9', () => {
    expect(calcBMI(92.3, 182)).toBe(27.9);
  });
  it('91kg / 182cm → 27.5', () => {
    expect(calcBMI(91, 182)).toBe(27.5);
  });
  it('lower weight → lower BMI', () => {
    expect(calcBMI(91, 182)).toBeLessThan(calcBMI(92.3, 182));
  });
  it('same weight, taller person → lower BMI', () => {
    expect(calcBMI(91, 185)).toBeLessThan(calcBMI(91, 182));
  });
});

describe('getWeightForDate', () => {
  const weights = [
    { date: '2026-5-26', weight: 92.0 },
    { date: '2026-6-5',  weight: 92.3 },
    { date: '2026-6-6',  weight: 91.0 },
  ];

  it('exact date match returns that weight', () => {
    expect(getWeightForDate('2026-6-5', weights)).toBe(92.3);
  });
  it('date with no exact match returns closest within 7 days', () => {
    expect(getWeightForDate('2026-6-4', weights)).toBe(92.3);
  });
  it('returns null when no weight within 7 days', () => {
    expect(getWeightForDate('2026-1-1', weights)).toBeNull();
  });
  it('empty weights array returns null', () => {
    expect(getWeightForDate('2026-6-5', [])).toBeNull();
  });
  it('picks the closer of two weights', () => {
    // 2026-6-6 weight (91) is 1 day from 2026-6-7; 2026-6-5 weight (92.3) is 2 days away
    expect(getWeightForDate('2026-6-7', weights)).toBe(91.0);
  });
});

describe('buildBmiChartData — synthetic today point', () => {
  const arr = [
    { date: '2026-5-26', dateLabel: '26 May 2026', bmi: 27.8 },
    { date: '2026-6-5',  dateLabel: '5 Jun 2026',  bmi: 27.9 },
  ];

  it('no synthetic point when latest weight date = last entry date', () => {
    const { vals } = buildBmiChartData(arr, 92.3, 182, '2026-6-5');
    expect(vals).toHaveLength(2);
  });
  it('appends synthetic today point when latest weight is newer', () => {
    const { vals, labels } = buildBmiChartData(arr, 91, 182, '2026-6-6');
    expect(vals).toHaveLength(3);
    expect(vals[2]).toBe(27.5);
    expect(labels[2]).toBe('Today');
  });
  it('synthetic point uses correct BMI from latest weight', () => {
    const { vals } = buildBmiChartData(arr, 91, 182, '2026-6-10');
    expect(vals[vals.length - 1]).toBe(calcBMI(91, 182));
  });
  it('no synthetic point when arr is empty', () => {
    const { vals } = buildBmiChartData([], 91, 182, '2026-6-6');
    expect(vals).toHaveLength(0);
  });
  it('no synthetic point when latestW is null', () => {
    const { vals } = buildBmiChartData(arr, null, 182, '2026-6-6');
    expect(vals).toHaveLength(2);
  });
});

// ── Render results ────────────────────────────────────────────────────────────

let totalPass = 0, totalFail = 0;
const container = document.getElementById('results');
suites.forEach(suite => {
  const div = document.createElement('div');
  div.className = 'suite';
  div.innerHTML = `<div class="suite-name">${suite.name}</div>`;
  suite.tests.forEach(t => {
    totalPass += t.pass ? 1 : 0;
    totalFail += t.pass ? 0 : 1;
    div.innerHTML += `
      <div class="test">
        <span class="badge ${t.pass ? 'badge-pass' : 'badge-fail'}">${t.pass ? 'PASS' : 'FAIL'}</span>
        <div><span class="${t.pass ? 'pass' : 'fail'}">${t.name}</span>${t.err ? `<div class="err">${t.err}</div>` : ''}</div>
      </div>`;
  });
  container.appendChild(div);
});

const summary = document.createElement('div');
summary.className = `summary ${totalFail === 0 ? 'all-pass' : 'has-fail'}`;
summary.textContent = totalFail === 0
  ? `All ${totalPass} tests passed`
  : `${totalFail} failed · ${totalPass} passed`;
container.appendChild(summary);
</script>
</body>
</html>
